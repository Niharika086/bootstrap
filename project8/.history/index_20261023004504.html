<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Navbar</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">

    <!-- Hamburger button visible on ALL screen sizes -->
    <button class="navbar-toggler" type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarToggleExternalContent"
      aria-controls="navbarToggleExternalContent"
      aria-expanded="false"
      aria-label="Toggle navigation">

      <span class="navbar-toggler-icon"></span>
    </button>

  </div>
</nav>

<!-- Content shown when button is clicked -->
<div class="collapse" id="navbarToggleExternalContent">
  <div class="bg-dark p-4">
    <h5 class="text-white">Menu</h5>
    <a href="#" class="d-block text-white mb-2"><i class="fa-solid fa-house" style="color: rgb(244, 245, 248);"></i>Home</a>
    <a href="#" class="d-block text-white mb-2">About</a>
    <a href="#" class="d-block text-white">Contact</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
