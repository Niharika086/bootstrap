<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <!-- font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Edu+NSW+ACT+Cursive:wght@400..700&family=Macondo&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Playwrite+CA:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Qwitcher+Grypen:wght@400;700&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- font  -->
    <!-- icon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- icon -->
  </head>
  <body>
    <div class="container-fluid px-0">
      <!-- Header -->
      <header class="college-header">
        <div class="container-fluid px-3 px-lg-4">
          <div class="row align-items-center g-3 py-3">
            <!-- Logo -->
            <div class="col-12 col-lg-1 text-center">
              <img
                src="https://www.iimsayodhya.com/images/finallogo.webp"
                alt="IIMS Ayodhya Logo"
                class="college-logo"
              />
            </div>

            <!-- Institute name -->
            <div class="col-12 col-lg-8 text-center text-lg-start">
              <h1 class="college-title"> INDIAN INSTITUTE OF MEDICAL SCIENCES, AYODHYA </h1>
              <p class="college-subtitle mb-0">Affiliated with Abdul Kalam Technical University and approved by the Government of Uttar Pradesh and Indian Nursing Council.</p>
            </div>

            <!-- Login and prospectus -->
            <div class="col-12 col-lg-3">
              <div class="header-actions">
                <a href="#" class="header-link">
                  <img
                    src="https://www.iimsayodhya.com/images/erpIcon.webp"
                    alt=""
                  />
                  ERP LOGIN
                </a>

                <a href="#" class="header-link">
                  <img
                    src="https://www.iimsayodhya.com/images/loginIcon.webp"
                    alt=""
                  />
                  LOGIN
                </a>
              </div>

              <div class="text-center text-lg-end mt-2">
                <a href="#" class="prospectus-link">
                  Download Prospectus
                  <i class="fa-solid fa-arrow-down"></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- Responsive Navbar -->
      <nav class="navbar navbar-expand-lg college-navbar">
        <div class="container-fluid px-3 px-lg-4">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collegeNavbar"
            aria-controls="collegeNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="collegeNavbar">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" href="#">Home</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">About Us</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">Admission</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">Courses</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">Gallery</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">Career</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">Contact Us</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <!-- social side bar -->
      <div class="social-bar">
        <a href=""
          ><i
            class="fa-brands fa-facebook fa-2xl"
            style="color: rgb(3, 3, 3)"
          ></i
        ></a>
        <a href=""
          ><i
            class="fa-brands fa-square-twitter fa-2xl"
            style="color: rgb(3, 3, 3)"
          ></i
        ></a>
        <a href=""
          ><i
            class="fa-brands fa-instagram fa-2xl"
            style="color: rgb(3, 3, 3)"
          ></i
        ></a>
        <a href=""
          ><i
            class="fa-brands fa-whatsapp fa-2xl"
            style="color: rgb(3, 3, 3)"
          ></i
        ></a>
      </div>
      <!-- social side bar -->
      <!-- main container -->
      <div class="row">
        <div class="col-sm-6">
          <img
            src="https://www.iimsayodhya.com/images/HomeImg.jpg"
            alt=""
            width="750"
            height="550"
          />
        </div>
        <div class="col-sm-6">
          <div class="row">
            <div style="font-size: 70px">01</div>
          </div>
        </div>
      </div>
      <!-- main container -->
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
